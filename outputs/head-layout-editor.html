<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>헤드 섹션 편집기</title>
  <style>
    :root {
      --ink: #173654;
      --muted: #63737d;
      --line: #d9e8e2;
      --accent: #2f8a6d;
      --accent-strong: #246a55;
      --warm: #9a673c;
      --paper: #fffdf8;
      --panel: #ffffff;
      --soft: #eef8f4;
      --shadow: 0 18px 50px rgba(36, 63, 68, .13);
      --radius: 8px;
      --stage-w: 1360;
      --stage-h: 640;
      --scale: 1;
    }

    * {
      box-sizing: border-box;
    }

    [hidden] {
      display: none !important;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        linear-gradient(135deg, rgba(244, 250, 247, .96), rgba(255, 253, 248, .96)),
        radial-gradient(circle at 12% 10%, rgba(92, 143, 105, .14), transparent 28%),
        radial-gradient(circle at 84% 78%, rgba(153, 103, 60, .11), transparent 26%);
      font-family: "Pretendard", "Noto Sans KR", system-ui, sans-serif;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 60;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 18px;
      background: rgba(255, 255, 255, .88);
      border-bottom: 1px solid rgba(143, 176, 160, .38);
      box-shadow: 0 10px 30px rgba(61, 91, 86, .08);
      backdrop-filter: blur(16px);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      min-width: 190px;
      font-weight: 800;
      color: #173654;
    }

    .brand-mark {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: inline-grid;
      place-items: center;
      color: #fff;
      background: linear-gradient(135deg, #327f6d, #95b85e);
      font-size: 17px;
    }

    .topbar-spacer {
      flex: 1;
    }

    .segmented {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      padding: 3px;
      border: 1px solid rgba(143, 176, 160, .44);
      border-radius: 999px;
      background: rgba(255, 255, 255, .72);
    }

    .segmented button,
    .topbar-btn {
      min-height: 34px;
      padding: 0 13px;
      border-radius: 999px;
      color: #34515a;
      background: transparent;
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
    }

    .segmented button.active,
    .topbar-btn.primary,
    .topbar-btn.active {
      color: #fff;
      background: var(--accent);
    }

    .topbar-btn.ghost {
      border: 1px solid rgba(143, 176, 160, .44);
      background: rgba(255, 255, 255, .76);
    }

    .history-actions {
      display: inline-flex;
      gap: 4px;
    }

    .history-actions button {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      color: #2d5059;
      background: rgba(255, 255, 255, .8);
      border: 1px solid rgba(143, 176, 160, .4);
      font-size: 18px;
      line-height: 1;
    }

    .history-actions button:disabled {
      opacity: .35;
      cursor: default;
    }

    body.desktop-device-access:not(.mobile-device-preview) .viewport-switch {
      display: none;
    }

    body.mobile-device-preview .viewport-switch [data-viewport="desktop"] {
      display: none;
    }

    body.physical-mobile-access .viewport-switch,
    body.physical-mobile-access #mobilePreviewBtn {
      display: none;
    }

    body.preview-mode .editing-only {
      display: none !important;
    }

    body.preview-mode .editable {
      outline: 0 !important;
    }

    body.preview-mode .handle,
    body.preview-mode .resize-handle,
    body.preview-mode .rotate-handle,
    body.preview-mode .edit-label,
    body.preview-mode .background-float,
    body.preview-mode .inline-toolbar,
    body.preview-mode .inline-toolbar-float {
      display: none !important;
    }

    .workspace {
      min-width: 0;
      min-height: 0;
      padding: 20px;
      display: grid;
      place-items: center;
    }

    .stage-shell {
      width: 100%;
      height: calc(100vh - 96px);
      min-height: 540px;
      display: grid;
      place-items: center;
      overflow: auto;
      border: 1px solid rgba(143, 176, 160, .28);
      border-radius: 18px;
      background:
        linear-gradient(45deg, rgba(217, 232, 226, .35) 25%, transparent 25%),
        linear-gradient(-45deg, rgba(217, 232, 226, .35) 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, rgba(217, 232, 226, .35) 75%),
        linear-gradient(-45deg, transparent 75%, rgba(217, 232, 226, .35) 75%);
      background-size: 28px 28px;
      background-position: 0 0, 0 14px, 14px -14px, -14px 0;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .78);
    }

    .stage-scale {
      width: calc(var(--stage-w) * 1px * var(--scale));
      height: calc(var(--stage-h) * 1px * var(--scale));
    }

    .stage {
      position: relative;
      width: calc(var(--stage-w) * 1px);
      height: calc(var(--stage-h) * 1px);
      overflow: hidden;
      transform: scale(var(--scale));
      transform-origin: top left;
      border-radius: 0;
      background: #fffdf8;
      box-shadow: 0 24px 80px rgba(53, 78, 74, .18);
      isolation: isolate;
    }

    .stage.mobile {
      border-radius: 28px;
      box-shadow: 0 26px 80px rgba(40, 60, 58, .2);
    }

    .stage.tablet {
      border-radius: 20px;
    }

    .background-fill {
      position: absolute;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      background: var(--section-bg-color, #fffdf8);
    }

    .stage.mobile .background-fill {
      background: var(--section-bg-color, #fffdf8);
    }

    .background-image {
      position: absolute;
      left: var(--background-image-x, 0%);
      top: var(--background-image-y, 0%);
      width: var(--background-image-w, 100%);
      height: var(--background-image-h, 100%);
      object-fit: fill;
      opacity: var(--background-opacity, 1);
      user-select: none;
      -webkit-user-drag: none;
    }

    .background-edit-hit {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }

    .stage.has-background-image.edit-mode.background-editing .background-edit-hit {
      pointer-events: auto;
      background: rgba(255, 255, 255, .04);
    }

    .background-image-frame {
      position: absolute;
      left: var(--background-image-x, 0%);
      top: var(--background-image-y, 0%);
      width: var(--background-image-w, 100%);
      height: var(--background-image-h, 100%);
      border: 2px dashed rgba(47, 138, 109, .78);
      pointer-events: none;
      display: none;
    }

    .stage.has-background-image.edit-mode.background-editing .background-image-frame {
      display: block;
    }

    .background-corner {
      position: absolute;
      width: 18px;
      height: 18px;
      border-radius: 5px;
      background: #fff;
      border: 2px solid var(--accent);
      pointer-events: auto;
    }

    .background-corner[data-corner="nw"] {
      left: -9px;
      top: -9px;
      cursor: nwse-resize;
    }

    .background-corner[data-corner="ne"] {
      right: -9px;
      top: -9px;
      cursor: nesw-resize;
    }

    .background-corner[data-corner="sw"] {
      left: -9px;
      bottom: -9px;
      cursor: nesw-resize;
    }

    .background-corner[data-corner="se"] {
      right: -9px;
      bottom: -9px;
      cursor: nwse-resize;
    }

    .layer-host {
      position: absolute;
      inset: 0;
      z-index: 2;
    }

    .editable {
      position: absolute;
      transform-origin: center center;
      outline: 1px solid transparent;
      border-radius: 8px;
    }

    .edit-mode .editable:hover,
    .editable.selected {
      outline: 2px dashed rgba(47, 138, 109, .64);
      outline-offset: 3px;
    }

    .layer-content {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .text-layer {
      display: flex;
      align-items: flex-start;
      white-space: pre-wrap;
      word-break: keep-all;
      letter-spacing: 0;
      line-height: 1.45;
      color: var(--layer-color, var(--ink));
      font-family: var(--layer-font, "Noto Serif KR", "Batang", serif);
      font-size: var(--layer-font-size, 34px);
      font-weight: var(--layer-font-weight, 700);
      text-align: var(--layer-align, left);
      opacity: var(--layer-opacity, 1);
      background: var(--layer-bg, transparent);
    }

    .text-layer[contenteditable="true"]:focus,
    .card-title[contenteditable="true"]:focus,
    .card-body[contenteditable="true"]:focus {
      outline: 0;
    }

    .title-layer {
      font-size: var(--layer-font-size, 40px);
      line-height: 1.55;
    }

    .body-layer {
      font-family: var(--layer-font, "Pretendard", "Noto Sans KR", system-ui, sans-serif);
      font-size: var(--layer-font-size, 20px);
      font-weight: 600;
      line-height: 1.72;
      color: var(--layer-color, #3d4d55);
    }

    .icon-layer {
      display: grid;
      place-items: center;
      color: var(--layer-color, var(--accent));
      opacity: var(--layer-opacity, 1);
    }

    .icon-layer svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .icon-layer img,
    .image-layer img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      opacity: var(--layer-opacity, 1);
      user-select: none;
      -webkit-user-drag: none;
    }

    .image-layer {
      border-radius: var(--image-radius, 0);
      overflow: hidden;
      background:
        radial-gradient(circle at 44% 43%, rgba(228, 197, 165, .78), transparent 23%),
        radial-gradient(circle at 70% 42%, rgba(130, 171, 138, .28), transparent 24%),
        linear-gradient(135deg, rgba(255, 245, 233, .62), rgba(223, 237, 229, .72));
    }

    .image-placeholder {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      color: rgba(23, 54, 84, .45);
      font-size: 15px;
      font-weight: 800;
    }

    .mission-card {
      display: grid;
      grid-template-columns: minmax(80px, 16%) 1fr;
      gap: 28px;
      align-items: center;
      padding: 22px 44px;
      border-radius: 8px;
      background: rgba(231, 246, 248, .88);
      box-shadow: 0 16px 40px rgba(63, 105, 110, .12);
      color: var(--ink);
      opacity: var(--layer-opacity, 1);
    }

    .mission-icon {
      aspect-ratio: 1;
      width: 100%;
      max-width: 132px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #fff;
      color: #315f82;
      overflow: hidden;
    }

    .mission-icon svg {
      width: 64%;
      height: 64%;
    }

    .mission-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .mission-copy {
      min-width: 0;
    }

    .card-title {
      margin: 0 0 8px;
      color: var(--layer-color, #17806b);
      font-size: var(--layer-font-size, 27px);
      font-weight: 900;
      line-height: 1.25;
      font-family: var(--layer-font, "Pretendard", "Noto Sans KR", system-ui, sans-serif);
    }

    .card-body {
      margin: 0;
      color: var(--card-body-color, #173654);
      font-size: calc(var(--layer-font-size, 27px) * .98);
      font-family: var(--layer-font, "Noto Serif KR", "Batang", serif);
      font-weight: 700;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: keep-all;
    }

    .service-card {
      display: grid;
      grid-template-columns: 54px 1fr;
      gap: 12px;
      align-items: center;
      height: 100%;
      padding: 12px 16px;
      border-radius: 12px;
      background: rgba(255, 255, 255, .9);
      box-shadow: 0 10px 28px rgba(51, 87, 83, .1);
      opacity: var(--layer-opacity, 1);
    }

    .service-icon {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--service-icon-bg, #f3b36b);
      color: #fff;
      overflow: hidden;
    }

    .service-icon svg {
      width: 64%;
      height: 64%;
    }

    .service-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .service-copy {
      min-width: 0;
    }

    .service-card .card-title {
      margin: 0 0 3px;
      color: var(--layer-color, #2f3c3f);
      font-size: var(--layer-font-size, 17px);
      font-family: var(--layer-font, "Pretendard", "Noto Sans KR", system-ui, sans-serif);
      line-height: 1.22;
    }

    .service-card .card-body {
      color: #68777b;
      font-size: calc(var(--layer-font-size, 17px) * .72);
      font-family: "Pretendard", "Noto Sans KR", system-ui, sans-serif;
      font-weight: 700;
      line-height: 1.35;
    }

    .handle,
    .resize-handle,
    .rotate-handle {
      position: absolute;
      z-index: 4;
      display: none;
      box-shadow: 0 6px 16px rgba(43, 76, 72, .15);
    }

    .editable.selected .handle,
    .editable.selected .resize-handle,
    .editable.selected .rotate-handle {
      display: block;
    }

    .handle {
      left: -14px;
      top: -14px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #fff;
      border: 2px solid var(--accent);
      cursor: grab;
    }

    .handle::before,
    .handle::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 13px;
      height: 2px;
      background: var(--accent);
      transform: translate(-50%, -50%);
    }

    .handle::after {
      width: 2px;
      height: 13px;
    }

    .resize-handle {
      right: -12px;
      bottom: -12px;
      width: 24px;
      height: 24px;
      border-radius: 6px;
      background: var(--accent);
      cursor: nwse-resize;
    }

    .rotate-handle {
      right: -13px;
      top: -14px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: none;
      place-items: center;
      color: #fff;
      background: var(--warm);
      cursor: alias;
      font-size: 15px;
      font-weight: 900;
      line-height: 28px;
      text-align: center;
    }

    .editable.selected .rotate-handle {
      display: grid;
    }

    .edit-label {
      position: absolute;
      left: 0;
      bottom: calc(100% + 8px);
      padding: 5px 8px;
      border-radius: 999px;
      color: var(--accent-strong);
      background: rgba(255, 255, 255, .94);
      border: 1px dashed rgba(47, 138, 109, .5);
      font-size: 12px;
      font-weight: 900;
      white-space: nowrap;
      display: none;
      pointer-events: none;
    }

    .editable.selected .edit-label {
      display: block;
    }

    .background-float {
      position: fixed;
      left: var(--background-float-left, 16px);
      top: var(--background-float-top, 48%);
      z-index: 70;
      display: flex;
      align-items: flex-start;
      gap: 8px;
      transform: translateY(-50%);
    }

    .background-float-toggle,
    .inline-toolbar-float {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      color: #fff;
      background: var(--accent);
      box-shadow: var(--shadow);
      font-size: 13px;
      font-weight: 900;
    }

    .background-float.has-custom .background-float-toggle {
      background: var(--accent-strong);
    }

    .background-float-panel {
      width: 268px;
      padding: 12px;
      border-radius: 14px;
      background: rgba(255, 253, 248, .97);
      border: 1px solid rgba(143, 176, 160, .42);
      box-shadow: var(--shadow);
      display: none;
    }

    .background-float.open .background-float-panel {
      display: grid;
      gap: 10px;
    }

    .background-float-panel strong {
      font-size: 14px;
    }

    .background-float-panel input[readonly] {
      width: 100%;
      min-width: 0;
      padding: 7px 9px;
      border: 1px solid rgba(143, 176, 160, .35);
      border-radius: 8px;
      color: #476065;
      background: #fff;
      font-size: 12px;
    }

    .background-actions,
    .background-color-row {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
    }

    .mini {
      min-height: 32px;
      padding: 0 8px;
      border-radius: 8px;
      color: #fff;
      background: var(--accent);
      font-size: 12px;
      font-weight: 900;
    }

    .mini.ghost {
      color: var(--accent-strong);
      background: #eef8f4;
    }

    .background-color-row input[type="color"] {
      width: 100%;
      height: 32px;
      padding: 0;
      border: 0;
      background: transparent;
    }

    .float-control {
      display: grid;
      grid-template-columns: 54px 1fr 42px;
      align-items: center;
      gap: 7px;
      color: #476065;
      font-size: 12px;
      font-weight: 900;
    }

    .float-control input[type="range"] {
      width: 100%;
    }

    .float-control output {
      text-align: right;
      color: var(--accent-strong);
    }

    .inline-toolbar {
      position: fixed;
      left: 0;
      top: 0;
      z-index: 80;
      width: min(760px, calc(100vw - 24px));
      padding: 10px;
      border-radius: 14px;
      background: rgba(255, 253, 248, .97);
      border: 1px solid rgba(143, 176, 160, .44);
      box-shadow: var(--shadow);
    }

    .toolbar-head {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .toolbar-drag {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      border: 1px solid rgba(143, 176, 160, .44);
      background:
        radial-gradient(circle, var(--accent) 1.5px, transparent 2px) 0 0 / 9px 9px;
      cursor: grab;
      flex: 0 0 auto;
    }

    .toolbar-title {
      min-width: 0;
      flex: 1;
      font-size: 14px;
      font-weight: 900;
      color: #244852;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .toolbar-collapse {
      min-height: 30px;
      padding: 0 10px;
      border-radius: 8px;
      color: #fff;
      background: var(--accent);
      font-size: 12px;
      font-weight: 900;
    }

    .toolbar-main {
      display: grid;
      grid-template-columns: repeat(8, minmax(0, auto));
      gap: 7px;
      align-items: end;
    }

    .toolbar-control {
      display: grid;
      gap: 4px;
      min-width: 76px;
      color: #476065;
      font-size: 11px;
      font-weight: 900;
    }

    .toolbar-control input[type="range"] {
      width: 112px;
    }

    .toolbar-control input[type="color"] {
      width: 46px;
      height: 34px;
      padding: 0;
      border: 0;
      background: transparent;
    }

    .toolbar-control select {
      min-height: 34px;
      border: 1px solid rgba(143, 176, 160, .38);
      border-radius: 8px;
      background: #fff;
      color: #2e4b53;
      font-weight: 800;
      font-size: 12px;
    }

    .toolbar-control output {
      color: var(--accent-strong);
      font-size: 11px;
    }

    .toolbar-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: flex-end;
    }

    .toolbar-actions button {
      min-height: 34px;
      padding: 0 10px;
      border-radius: 8px;
      color: #244852;
      background: #eef8f4;
      font-size: 12px;
      font-weight: 900;
      white-space: nowrap;
    }

    .toolbar-actions button.primary {
      color: #fff;
      background: var(--accent);
    }

    .toolbar-actions button.danger {
      color: #9d3e36;
      background: #fff0ed;
    }

    .inline-toolbar-float {
      position: fixed;
      left: var(--toolbar-float-left, 16px);
      top: var(--toolbar-float-top, 58%);
      z-index: 79;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 22px;
      z-index: 120;
      transform: translateX(-50%);
      max-width: min(520px, calc(100vw - 24px));
      padding: 10px 14px;
      border-radius: 999px;
      color: #fff;
      background: rgba(25, 45, 49, .92);
      font-weight: 800;
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .18s ease;
    }

    .toast.show {
      opacity: 1;
    }

    .hidden-file {
      display: none;
    }

    body.mobile-device-preview .topbar,
    body.physical-mobile-access .topbar {
      position: fixed;
      left: var(--mobile-topbar-left, 8px);
      top: var(--mobile-topbar-top, 8px);
      width: var(--mobile-topbar-width, min(390px, calc(100vw - 20px)));
      z-index: 90;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 6px;
      padding: 8px;
      border-radius: 14px;
    }

    body.mobile-device-preview .brand,
    body.physical-mobile-access .brand {
      min-width: 0;
      font-size: 13px;
    }

    body.mobile-device-preview .brand-mark,
    body.physical-mobile-access .brand-mark {
      width: 24px;
      height: 24px;
    }

    body.mobile-device-preview .topbar-spacer,
    body.physical-mobile-access .topbar-spacer {
      display: none;
    }

    body.mobile-device-preview .topbar .segmented,
    body.mobile-device-preview .topbar .history-actions,
    body.mobile-device-preview .topbar .topbar-btn,
    body.physical-mobile-access .topbar .segmented,

  <script>
    const storageKey = "modu-head-section-editor-v2";
    const viewportProfiles = {

    };
    const viewportKeys = Object.keys(viewportProfiles);

    const stage = document.getElementById("stage");
    const stageShell = document.getElementById("stageShell");
    const stageScale = document.getElementById("stageScale");
    const layerHost = document.getElementById("layerHost");
    const backgroundFill = document.getElementById("backgroundFill");
    const backgroundImage = document.getElementById("backgroundImage");
    const backgroundEditHit = document.getElementById("backgroundEditHit");
    const backgroundFloat = document.getElementById("backgroundFloat");
    const backgroundFloatToggle = document.getElementById("backgroundFloatToggle");
    const backgroundName = document.getElementById("backgroundName");
    const backgroundOpacityRange = document.getElementById("backgroundOpacityRange");
    const backgroundOpacityValue = document.getElementById("backgroundOpacityValue");
    const backgroundColorInput = document.getElementById("backgroundColorInput");
    const inlineToolbar = document.getElementById("inlineToolbar");
    const inlineToolbarFloat = document.getElementById("inlineToolbarFloat");
    const toolbarDragHandle = document.getElementById("toolbarDragHandle");
    const toolbarTitle = document.getElementById("toolbarTitle");
    const fontSizeRange = document.getElementById("fontSizeRange");

    const fontFamilySelect = document.getElementById("fontFamilySelect");
    const angleRange = document.getElementById("angleRange");

    const opacityRange = document.getElementById("opacityRange");
    const opacityValue = document.getElementById("opacityValue");
    const toast = document.getElementById("toast");
    const undoBtn = document.getElementById("undoBtn");
    const redoBtn = document.getElementById("redoBtn");

    function layout(desktop, phoneSmall, phone, tablet) {
      return {
        desktop: { ...desktop },
        phoneSmall: { ...(phoneSmall ?? phone ?? desktop) },
        phone: { ...(phone ?? phoneSmall ?? desktop) },
        tablet: { ...(tablet ?? desktop) }

        {

          styles: { color: "#173654", fontSize: 40, fontFamily: "'Noto Serif KR','Batang',serif", opacity: 100 },
          layouts: layout(
            { x: 10.2, y: 29.8, w: 22, h: 10, r: 0, z: 6 },

        },
        {

          variant: "body",
          styles: { color: "#4d5a60", fontSize: 18, fontFamily: "'Pretendard','Noto Sans KR',system-ui,sans-serif", opacity: 100 },
          layouts: layout(
            { x: 10.4, y: 45, w: 38, h: 6, r: 0, z: 6 },
            { x: 7.2, y: 35.5, w: 82, h: 5.5, r: 0, z: 6 },
            { x: 7.5, y: 35, w: 82, h: 5.5, r: 0, z: 6 },
            { x: 8, y: 33.5, w: 62, h: 5.5, r: 0, z: 6 }
          )
        },
        {
          id: "intro-2",
          type: "text",
          label: "부연 설명 2",
          text: "지역 주민 가까이에서 필요한 복지서비스를 제공합니다.",
          variant: "body",
          styles: { color: "#4d5a60", fontSize: 18, fontFamily: "'Pretendard','Noto Sans KR',system-ui,sans-serif", opacity: 100 },
          layouts: layout(
            { x: 10.4, y: 51.4, w: 34, h: 6, r: 0, z: 6 },
            { x: 7.2, y: 41.2, w: 82, h: 5.5, r: 0, z: 6 },
            { x: 7.5, y: 40.8, w: 82, h: 5.5, r: 0, z: 6 },

          title: "법인의 미션",
          body: "모든 이웃이 존중받고,\n지역 안에서 함께 살아갈 수 있는\n복지 공동체를 만듭니다.",
          styles: { color: "#16806d", fontSize: 27, fontFamily: "'Noto Serif KR','Batang',serif", opacity: 100 },
          layouts: layout(
            { x: 9, y: 62, w: 82, h: 29, r: 0, z: 8 },
            { x: 7, y: 69.5, w: 86, h: 21.5, r: 0, z: 8 },
            { x: 7, y: 69, w: 86, h: 21.5, r: 0, z: 8 },
            { x: 8, y: 62, w: 84, h: 23, r: 0, z: 8 }
          )
        }
      ];
    }

    const state = {
      mode: "edit",
      viewport: "desktop",
      previewViewport: "phone",
      accessDevice: "desktop",
      viewportLocked: null,
      selectedLayerId: "headline-1",
      nextLayerId: 1,
      layers: createInitialLayers(),
      background: {
        mode: "default",
        color: "#fffdf8",
        colorEnabled: false,
        imageName: null,
        imageDataUrl: null,
        naturalWidth: null,
        naturalHeight: null,
        imageX: 0,
        imageY: 0,
        imageW: 100,
        imageH: 100,
        opacity: 100,
        editing: false,
        layouts: null
      },
      toolbar: { collapsed: false, manual: false, x: 0, y: 0 },
      history: { stack: [], index: -1, restoring: false },
      toastTimer: null
    };

    function clamp(value, min, max) {
      return Math.min(max, Math.max(min, value));
    }

    function normalizeViewportKey(key) {
      if (key === "mobile") return "phone";
      return viewportProfiles[key] ? key : "desktop";
    }

    function currentLayout(layer) {
      const viewport = normalizeViewportKey(state.viewport);
      layer.layouts[viewport] ??= { ...layer.layouts.desktop };
      return layer.layouts[viewport];
    }

    function showToast(message) {
      clearTimeout(state.toastTimer);
      toast.textContent = message;
      toast.classList.add("show");
      state.toastTimer = setTimeout(() => toast.classList.remove("show"), 1800);
    }

    function iconSvg(name) {
      if (name === "leaf") {
        return `<svg viewBox="0 0 64 64" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" d="M29 57c0-20 5-36 22-47M31 38C17 37 9 28 9 13c16 2 25 10 26 25M35 29c-4-12 1-22 13-27 5 15 2 25-13 27"/></svg>`;
      }
      if (name === "heartHands") {
        return `<svg viewBox="0 0 80 80" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" d="M25 48c-7-8-9-17-3-22 5-4 12-1 18 7 6-8 13-11 18-7 6 5 4 14-3 22L40 63 25 48Z"/><path fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" d="M14 64V48c0-7 4-12 10-15M66 64V48c0-7-4-12-10-15"/></svg>`;
      }
      if (name === "chat") {
        return `<svg viewBox="0 0 64 64" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="round" d="M13 18h38v25H30L18 53V43h-5V18Z"/><path fill="currentColor" d="M24 31a3 3 0 1 0 0 .1M32 31a3 3 0 1 0 0 .1M40 31a3 3 0 1 0 0 .1"/></svg>`;
      }
      if (name === "plan") {
        return `<svg viewBox="0 0 64 64" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="round" d="M18 12h28v40H18z"/><path fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" d="M25 25h14M25 35h14M25 45h8"/></svg>`;
      }
      return `<svg viewBox="0 0 64 64" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" d="M22 33a10 10 0 1 1 0-20 10 10 0 0 1 0 20ZM42 51a10 10 0 1 1 0-20 10 10 0 0 1 0 20ZM30 25l7 9"/></svg>`;
    }

    function layerStyleVars(layer) {
      const styles = layer.styles ?? {};
      return [
        `--layer-color:${styles.color ?? "#173654"}`,
        `--layer-font-size:${styles.fontSize ?? 24}px`,
        `--layer-font:${styles.fontFamily ?? "'Pretendard','Noto Sans KR',system-ui,sans-serif"}`,
        `--layer-opacity:${(styles.opacity ?? 100) / 100}`,
        `--image-radius:${styles.radius ?? 0}px`,
        `--service-icon-bg:${styles.iconBg ?? "#8dcfbd"}`
      ].join(";");
    }

    function renderLayerContent(layer) {
      if (layer.type === "text") {
        const variant = layer.variant === "title" ? "title-layer" : "body-layer";
        return `<div class="layer-content text-layer ${variant}" contenteditable="true" data-field="text" spellcheck="false">${escapeHtml(layer.text)}</div>`;
      }
      if (layer.type === "icon") {
        const inner = layer.imageDataUrl
          ? `<img src="${layer.imageDataUrl}" alt="">`
          : iconSvg(layer.icon ?? "leaf");
        return `<div class="layer-content icon-layer">${inner}</div>`;
      }
      if (layer.type === "image") {
        const inner = layer.imageDataUrl
          ? `<img src="${layer.imageDataUrl}" alt="">`
          : `<div class="image-placeholder">${escapeHtml(layer.placeholder ?? "이미지")}</div>`;
        return `<div class="layer-content image-layer">${inner}</div>`;
      }
      if (layer.type === "mission") {
        const icon = layer.imageDataUrl ? `<img src="${layer.imageDataUrl}" alt="">` : iconSvg(layer.icon ?? "heartHands");
        return `
          <div class="layer-content mission-card">
            <div class="mission-icon">${icon}</div>
            <div class="mission-copy">
              <div class="card-title" contenteditable="true" data-field="title" spellcheck="false">${escapeHtml(layer.title)}</div>
              <div class="card-body" contenteditable="true" data-field="body" spellcheck="false">${escapeHtml(layer.body)}</div>
            </div>
          </div>`;
      }
      if (layer.type === "service") {
        const icon = layer.imageDataUrl ? `<img src="${layer.imageDataUrl}" alt="">` : iconSvg(layer.icon ?? "chat");
        return `
          <div class="layer-content service-card">
            <div class="service-icon">${icon}</div>
            <div class="service-copy">
              <div class="card-title" contenteditable="true" data-field="title" spellcheck="false">${escapeHtml(layer.title)}</div>
              <div class="card-body" contenteditable="true" data-field="body" spellcheck="false">${escapeHtml(layer.body)}</div>
            </div>
          </div>`;
      }
      return "";
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function renderLayers() {
      layerHost.innerHTML = "";
      state.layers
        .slice()
        .sort((a, b) => (currentLayout(a).z ?? 1) - (currentLayout(b).z ?? 1))
        .forEach((layer) => {
          const item = document.createElement("div");
          item.className = `editable${layer.id === state.selectedLayerId ? " selected" : ""}`;
          item.dataset.id = layer.id;
          item.style.cssText = layerStyleVars(layer);
          item.innerHTML = `
            ${renderLayerContent(layer)}
            <span class="handle" title="이동"></span>
            <span class="resize-handle" title="크기 조절"></span>
            <span class="rotate-handle" title="각도 조절">↻</span>
            <span class="edit-label">${escapeHtml(layer.label)}</span>`;
          layerHost.appendChild(item);
        });
      bindLayerEvents();
      applyLayouts();
    }

    function bindLayerEvents() {
      layerHost.querySelectorAll(".editable").forEach((el) => {
        const id = el.dataset.id;
        el.addEventListener("pointerdown", (event) => {
          if (event.target.closest(".handle, .resize-handle, .rotate-handle")) return;
          selectLayer(id);
        });
        el.querySelectorAll("[contenteditable]").forEach((editable) => {
          editable.addEventListener("input", () => {
            const layer = getLayer(id);
            if (!layer) return;
            const field = editable.dataset.field;
            layer[field] = editable.innerText;
            scheduleHistory();
          });
          editable.addEventListener("pointerdown", (event) => {
            selectLayer(id);
            event.stopPropagation();
          });
        });
        el.querySelector(".handle").addEventListener("pointerdown", (event) => beginLayerDrag(event, id));
        el.querySelector(".resize-handle").addEventListener("pointerdown", (event) => beginLayerResize(event, id));
        el.querySelector(".rotate-handle").addEventListener("pointerdown", (event) => beginLayerRotate(event, id));
      });
    }

    function getLayer(id) {
      return state.layers.find((layer) => layer.id === id) ?? null;
    }

    function applyLayouts() {
      const profile = viewportProfiles[normalizeViewportKey(state.viewport)];
      document.documentElement.style.setProperty("--stage-w", String(profile.w));
      document.documentElement.style.setProperty("--stage-h", String(profile.h));
      stage.style.setProperty("--stage-w", String(profile.w));
      stage.style.setProperty("--stage-h", String(profile.h));
      stage.className = `stage ${state.viewport === "desktop" ? "desktop" : "mobile"} ${state.viewport} ${state.mode}-mode${state.background.imageDataUrl ? " has-background-image" : ""}${state.background.editing ? " background-editing" : ""}`;
      stageScale.style.width = `${profile.w * getScale()}px`;
      stageScale.style.height = `${profile.h * getScale()}px`;

      state.layers.forEach((layer) => {
        const el = layerHost.querySelector(`[data-id="${CSS.escape(layer.id)}"]`);
        if (!el) return;
        const l = currentLayout(layer);
        el.style.left = `${l.x}%`;
        el.style.top = `${l.y}%`;
        el.style.width = `${l.w}%`;
        el.style.height = `${l.h}%`;
        el.style.zIndex = String(l.z ?? 1);
        el.style.transform = `rotate(${l.r ?? 0}deg)`;
        el.classList.toggle("selected", layer.id === state.selectedLayerId);
      });

      applyBackground();
      updateViewportButtons();
      updateModeButtons();
      updateToolbar();
      positionFloatingControls();
      positionToolbar();
    }

    function getScale() {
      const profile = viewportProfiles[normalizeViewportKey(state.viewport)];
      const shellRect = stageShell.getBoundingClientRect();
      const availableW = Math.max(280, shellRect.width - 28);
      const availableH = Math.max(320, shellRect.height - 28);
      const scale = Math.min(availableW / profile.w, availableH / profile.h, 1);
      document.documentElement.style.setProperty("--scale", String(scale));
      stage.style.setProperty("--scale", String(scale));
      return scale;
    }

    function selectLayer(id, options = {}) {
      if (!getLayer(id)) return;
      state.selectedLayerId = id;
      state.background.editing = false;
      if (options.expandToolbar !== false && state.mode === "edit" && state.toolbar.collapsed) {
        state.toolbar.collapsed = false;
        state.toolbar.manual = false;
        inlineToolbarFloat.hidden = true;
      }
      renderLayers();
    }

    function updateToolbar() {
      const layer = getLayer(state.selectedLayerId);
      if (!layer || state.mode !== "edit") {
        inlineToolbar.hidden = true;
        return;
      }
      toolbarTitle.textContent = layer.label;
      const styles = layer.styles ??= {};
      const layout = currentLayout(layer);
      fontSizeRange.value = styles.fontSize ?? 24;
      fontSizeValue.textContent = fontSizeRange.value;
      textColorInput.value = normalizeColor(styles.color ?? "#173654");
      fontFamilySelect.value = styles.fontFamily ?? "'Pretendard','Noto Sans KR',system-ui,sans-serif";
      angleRange.value = layout.r ?? 0;
      angleValue.textContent = `${angleRange.value}°`;
      opacityRange.value = styles.opacity ?? 100;
      opacityValue.textContent = `${opacityRange.value}%`;
      inlineToolbar.hidden = state.toolbar.collapsed;
      inlineToolbarFloat.hidden = !state.toolbar.collapsed;
    }

    function normalizeColor(color) {
      if (/^#[0-9a-f]{6}$/i.test(color)) return color;
      return "#173654";
    }

    function updateSelectedStyle(key, value) {
      const layer = getLayer(state.selectedLayerId);
      if (!layer) return;
      layer.styles ??= {};
      layer.styles[key] = value;
      renderLayers();
      recordHistory();
    }

    function updateSelectedLayout(key, value) {
      const layer = getLayer(state.selectedLayerId);
      if (!layer) return;
      currentLayout(layer)[key] = value;
      applyLayouts();
      recordHistory();
    }

    function beginLayerDrag(event, id) {
      event.preventDefault();
      event.stopPropagation();
      selectLayer(id, { expandToolbar: true });
      const layer = getLayer(id);
      const start = { x: event.clientX, y: event.clientY, layout: { ...currentLayout(layer) } };
      const target = event.currentTarget;
      target.setPointerCapture(event.pointerId);
      function move(moveEvent) {
        const rect = stage.getBoundingClientRect();
        const dx = (moveEvent.clientX - start.x) / rect.width * 100;
        const dy = (moveEvent.clientY - start.y) / rect.height * 100;
        const next = currentLayout(layer);
        next.x = clamp(start.layout.x + dx, -30, 130 - next.w);
        next.y = clamp(start.layout.y + dy, -30, 130 - next.h);
        applyLayouts();
      }
      function end() {
        target.releasePointerCapture(event.pointerId);
        target.removeEventListener("pointermove", move);
        target.removeEventListener("pointerup", end);
        target.removeEventListener("pointercancel", end);
        recordHistory();
      }
      target.addEventListener("pointermove", move);
      target.addEventListener("pointerup", end);
      target.addEventListener("pointercancel", end);
    }

    function beginLayerResize(event, id) {
      event.preventDefault();
      event.stopPropagation();
      selectLayer(id, { expandToolbar: true });
      const layer = getLayer(id);
      const start = { x: event.clientX, y: event.clientY, layout: { ...currentLayout(layer) } };
      const target = event.currentTarget;
      target.setPointerCapture(event.pointerId);
      function move(moveEvent) {
        const rect = stage.getBoundingClientRect();
        const dx = (moveEvent.clientX - start.x) / rect.width * 100;
        const dy = (moveEvent.clientY - start.y) / rect.height * 100;
        const next = currentLayout(layer);
        next.w = clamp(start.layout.w + dx, 3, 130);
        next.h = clamp(start.layout.h + dy, 3, 130);
        applyLayouts();
      }
      function end() {
        target.releasePointerCapture(event.pointerId);
        target.removeEventListener("pointermove", move);
        target.removeEventListener("pointerup", end);
        target.removeEventListener("pointercancel", end);
        recordHistory();
      }
      target.addEventListener("pointermove", move);
      target.addEventListener("pointerup", end);
      target.addEventListener("pointercancel", end);
    }

    function beginLayerRotate(event, id) {
      event.preventDefault();
      event.stopPropagation();
      selectLayer(id, { expandToolbar: true });
      const layer = getLayer(id);
      const layerEl = layerHost.querySelector(`[data-id="${CSS.escape(id)}"]`);
      const rect = layerEl.getBoundingClientRect();
      const center = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
      const start = { angle: currentLayout(layer).r ?? 0, pointer: Math.atan2(event.clientY - center.y, event.clientX - center.x) * 180 / Math.PI };
      const target = event.currentTarget;
      target.setPointerCapture(event.pointerId);
      function move(moveEvent) {
        const pointerAngle = Math.atan2(moveEvent.clientY - center.y, moveEvent.clientX - center.x) * 180 / Math.PI;
        currentLayout(layer).r = clamp(Math.round(start.angle + pointerAngle - start.pointer), -45, 45);
        applyLayouts();
      }
      function end() {
        target.releasePointerCapture(event.pointerId);
        target.removeEventListener("pointermove", move);
        target.removeEventListener("pointerup", end);
        target.removeEventListener("pointercancel", end);
        recordHistory();
      }
      target.addEventListener("pointermove", move);
      target.addEventListener("pointerup", end);
      target.addEventListener("pointercancel", end);
    }

    function bringToFront() {
      const layer = getLayer(state.selectedLayerId);
      if (!layer) return;
      const maxZ = Math.max(...state.layers.map((item) => currentLayout(item).z ?? 1));
      currentLayout(layer).z = maxZ + 1;
      renderLayers();
      recordHistory();
    }

    function sendToBack() {
      const layer = getLayer(state.selectedLayerId);
      if (!layer) return;
      const minZ = Math.min(...state.layers.map((item) => currentLayout(item).z ?? 1));
      currentLayout(layer).z = minZ - 1;
      renderLayers();
      recordHistory();
    }

    function deleteSelectedLayer() {
      if (state.layers.length <= 1) {
        showToast("마지막 요소는 삭제할 수 없습니다");
        return;
      }
      const index = state.layers.findIndex((layer) => layer.id === state.selectedLayerId);
      if (index < 0) return;
      state.layers.splice(index, 1);
      state.selectedLayerId = state.layers[Math.max(0, index - 1)].id;
      renderLayers();
      recordHistory();
    }

    function addLayer(type) {
      const id = `custom-${state.nextLayerId++}`;
      const base = {
        id,
        type,
        label: type === "text" ? "추가 텍스트" : type === "image" ? "추가 이미지" : type === "mission" ? "추가 하단 제목" : "추가 아이콘 카드",
        styles: { color: "#173654", fontSize: type === "service" ? 16 : 24, fontFamily: "'Pretendard','Noto Sans KR',system-ui,sans-serif", opacity: 100 },
        layouts: layout(
          { x: 12, y: 16, w: 24, h: 12, r: 0, z: getNextZ() },
          { x: 10, y: 18, w: 60, h: 10, r: 0, z: getNextZ() },
          { x: 10, y: 18, w: 60, h: 10, r: 0, z: getNextZ() },
          { x: 10, y: 18, w: 42, h: 10, r: 0, z: getNextZ() }
        )
      };
      if (type === "text") {
        Object.assign(base, { text: "새 텍스트", variant: "body" });
      } else if (type === "image") {
        Object.assign(base, { imageDataUrl: null, placeholder: "이미지" });
      } else if (type === "mission") {
        Object.assign(base, { icon: "heartHands", imageDataUrl: null, title: "새 제목", body: "부연 설명을 입력합니다." });
        base.layouts.desktop = { x: 10, y: 58, w: 68, h: 24, r: 0, z: getNextZ() };
      } else {
        Object.assign(base, { icon: "chat", imageDataUrl: null, title: "새 카드", body: "설명 문장", styles: { color: "#39474d", fontSize: 16, opacity: 100, iconBg: "#8dcfbd" } });
        base.layouts.desktop = { x: 10, y: 76, w: 24, h: 10, r: 0, z: getNextZ() };
      }
      state.layers.push(base);
      state.selectedLayerId = id;
      state.toolbar.collapsed = false;
      renderLayers();
      recordHistory();
    }

    function getNextZ() {
      return Math.max(...state.layers.map((layer) => currentLayout(layer).z ?? 1), 1) + 1;
    }

    function applyBackground() {
      backgroundFill.style.setProperty("--section-bg-color", state.background.colorEnabled ? state.background.color : "#fffdf8");
      backgroundImage.style.setProperty("--background-image-x", `${state.background.imageX}%`);
      backgroundImage.style.setProperty("--background-image-y", `${state.background.imageY}%`);
      backgroundImage.style.setProperty("--background-image-w", `${state.background.imageW}%`);
      backgroundImage.style.setProperty("--background-image-h", `${state.background.imageH}%`);
      backgroundImage.style.setProperty("--background-opacity", `${(state.background.opacity ?? 100) / 100}`);
      if (state.background.imageDataUrl) {
        backgroundImage.src = state.background.imageDataUrl;
        backgroundImage.hidden = false;
        backgroundName.value = state.background.imageName ?? "첨부 이미지";
      } else {
        backgroundImage.hidden = true;
        backgroundImage.removeAttribute("src");
        backgroundName.value = state.background.colorEnabled ? "색상 배경" : "기본 배경";
      }
      backgroundOpacityRange.value = state.background.opacity ?? 100;
      backgroundOpacityValue.textContent = `${backgroundOpacityRange.value}%`;
      backgroundColorInput.value = state.background.color ?? "#fffdf8";
      backgroundFloat.classList.toggle("has-custom", Boolean(state.background.imageDataUrl || state.background.colorEnabled));
    }

    function setBackgroundColor(color) {
      state.background.color = color;
      state.background.colorEnabled = true;
      state.background.mode = state.background.imageDataUrl ? "image" : "color";
      applyBackground();
      recordHistory();
    }

    function deleteBackgroundColor() {
      state.background.colorEnabled = false;
      state.background.mode = state.background.imageDataUrl ? "image" : "default";
      applyBackground();
      recordHistory();
    }

    function deleteBackgroundImage() {
      state.background.imageDataUrl = null;
      state.background.imageName = null;
      state.background.naturalWidth = null;
      state.background.naturalHeight = null;
      state.background.editing = false;
      applyLayouts();
      recordHistory();
    }

    function fitBackgroundImage() {
      if (!state.background.imageDataUrl) {
        showToast("먼저 배경 이미지를 첨부해 주세요");
        return;
      }
      const profile = viewportProfiles[normalizeViewportKey(state.viewport)];
      const stageRatio = profile.w / profile.h;
      const imageRatio = (state.background.naturalWidth || profile.w) / (state.background.naturalHeight || profile.h);
      if (imageRatio > stageRatio) {
        state.background.imageH = 100;
        state.background.imageW = imageRatio / stageRatio * 100;
      } else {
        state.background.imageW = 100;
        state.background.imageH = stageRatio / imageRatio * 100;
      }
      state.background.imageX = (100 - state.background.imageW) / 2;
      state.background.imageY = (100 - state.background.imageH) / 2;
      state.background.editing = true;
      applyLayouts();
      recordHistory();
      showToast("배경 이미지를 화면에 빈틈 없이 맞췄습니다");
    }

    function beginBackgroundEdit(event) {
      if (state.mode !== "edit" || !state.background.imageDataUrl || !state.background.editing) return;
      event.preventDefault();
      const corner = event.target.closest(".background-corner")?.dataset.corner;
      const start = {
        x: event.clientX,
        y: event.clientY,
        imageX: state.background.imageX,
        imageY: state.background.imageY,
        imageW: state.background.imageW,
        imageH: state.background.imageH
      };
      backgroundEditHit.setPointerCapture(event.pointerId);
      function move(moveEvent) {
        const rect = stage.getBoundingClientRect();
        const dx = (moveEvent.clientX - start.x) / rect.width * 100;
        const dy = (moveEvent.clientY - start.y) / rect.height * 100;
        if (!corner) {
          state.background.imageX = clamp(start.imageX + dx, -200, 200);
          state.background.imageY = clamp(start.imageY + dy, -200, 200);
        } else {
          let x = start.imageX;
          let y = start.imageY;
          let w = start.imageW;
          let h = start.imageH;
          if (corner.includes("w")) {
            x = start.imageX + dx;
            w = start.imageW - dx;
          }
          if (corner.includes("e")) w = start.imageW + dx;
          if (corner.includes("n")) {
            y = start.imageY + dy;
            h = start.imageH - dy;
          }
          if (corner.includes("s")) h = start.imageH + dy;
          state.background.imageX = clamp(x, -200, 200);
          state.background.imageY = clamp(y, -200, 200);
          state.background.imageW = clamp(w, 10, 300);
          state.background.imageH = clamp(h, 10, 300);
        }
        applyBackground();
      }
      function end() {
        backgroundEditHit.releasePointerCapture(event.pointerId);
        backgroundEditHit.removeEventListener("pointermove", move);
        backgroundEditHit.removeEventListener("pointerup", end);
        backgroundEditHit.removeEventListener("pointercancel", end);
        recordHistory();
      }
      backgroundEditHit.addEventListener("pointermove", move);
      backgroundEditHit.addEventListener("pointerup", end);
      backgroundEditHit.addEventListener("pointercancel", end);
    }

    function readImageFile(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          const image = new Image();
          image.onload = () => resolve({ dataUrl: reader.result, width: image.naturalWidth || image.width, height: image.naturalHeight || image.height });
          image.onerror = reject;
          image.src = reader.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function setViewport(key) {
      const viewport = normalizeViewportKey(key);
      if (state.viewportLocked && viewport !== state.viewportLocked) {
        showToast(`${viewportProfiles[state.viewportLocked].label} 화면으로 고정되어 있습니다`);
        return;
      }
      state.viewport = viewport;
      applyLayouts();
    }

    function updateViewportButtons() {
      document.querySelectorAll("[data-viewport]").forEach((btn) => {
        btn.classList.toggle("active", normalizeViewportKey(btn.dataset.viewport) === state.viewport);
      });
    }

    function setMode(mode) {
      state.mode = mode;
      document.body.classList.toggle("preview-mode", mode === "view");
      stage.classList.toggle("edit-mode", mode === "edit");
      stage.classList.toggle("view-mode", mode === "view");
      if (mode === "view") {
        inlineToolbar.hidden = true;
        inlineToolbarFloat.hidden = true;
        backgroundFloat.classList.remove("open");
      } else {
        updateToolbar();
      }
      applyLayouts();
    }

    function updateModeButtons() {
      document.getElementById("editModeBtn").classList.toggle("active", state.mode === "edit");
      document.getElementById("previewModeBtn").classList.toggle("active", state.mode === "view");
    }

    function toggleMobilePreview() {
      const active = !document.body.classList.contains("mobile-device-preview");
      document.body.classList.toggle("mobile-device-preview", active);
      document.getElementById("mobilePreviewBtn").textContent = active ? "PC 작업 보기" : "모바일 접근 보기";
      state.viewportLocked = null;
      state.viewport = active ? state.previewViewport : "desktop";
      applyLayouts();
      showToast(active ? "휴대폰 접근 화면으로 전환했습니다" : "PC 작업 화면으로 돌아왔습니다");
    }

    function detectAccessDevice() {
      const shortSide = Math.min(window.innerWidth, window.innerHeight);
      const hasTouch = navigator.maxTouchPoints > 0;
      const mobileUa = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
      if (mobileUa || (hasTouch && shortSide < 1200)) {
        const viewport = shortSide < 375 ? "phoneSmall" : shortSide < 600 ? "phone" : "tablet";
        state.accessDevice = "mobile";
        state.viewportLocked = viewport;
        state.viewport = viewport;
        document.body.classList.remove("desktop-device-access");
        document.body.classList.add("physical-mobile-access");
      }
    }

    function positionFloatingControls() {
      const stageRect = stage.getBoundingClientRect();
      const left = Math.max(8, Math.min(stageRect.left + 10, window.innerWidth - 64));
      const bgTop = clamp(stageRect.top + stageRect.height * .46, 78, window.innerHeight - 76);
      const tbTop = clamp(stageRect.top + stageRect.height * .58, 134, window.innerHeight - 64);
      document.documentElement.style.setProperty("--background-float-left", `${left}px`);
      document.documentElement.style.setProperty("--background-float-top", `${bgTop}px`);
      document.documentElement.style.setProperty("--toolbar-float-left", `${left}px`);
      document.documentElement.style.setProperty("--toolbar-float-top", `${tbTop}px`);
      document.documentElement.style.setProperty("--mobile-topbar-left", `${Math.max(8, stageRect.left + 8)}px`);
      document.documentElement.style.setProperty("--mobile-topbar-top", `${Math.max(8, stageRect.top + 8)}px`);
      document.documentElement.style.setProperty("--mobile-topbar-width", `${Math.min(stageRect.width - 16, 420)}px`);
      document.documentElement.style.setProperty("--toolbar-sheet-width", `${Math.min(stageRect.width - 16, 420)}px`);
    }

    function positionToolbar() {
      if (state.mode !== "edit" || state.toolbar.collapsed || inlineToolbar.hidden) return;
      const selected = layerHost.querySelector(`[data-id="${CSS.escape(state.selectedLayerId)}"]`);
      const width = inlineToolbar.offsetWidth || 640;
      const height = inlineToolbar.offsetHeight || 120;
      let left;
      let top;
      if (state.toolbar.manual) {
        left = state.toolbar.x;
        top = state.toolbar.y;
      } else if (selected) {
        const rect = selected.getBoundingClientRect();
        left = rect.left + rect.width / 2 - width / 2;
        top = rect.bottom + 18;
        if (top + height > window.innerHeight - 12) top = rect.top - height - 18;
      } else {
        left = window.innerWidth / 2 - width / 2;
        top = 110;
      }
      left = clamp(left, 8, Math.max(8, window.innerWidth - width - 8));
      top = clamp(top, 8, Math.max(8, window.innerHeight - height - 8));
      inlineToolbar.style.transform = `translate(${left}px, ${top}px)`;
    }

    function collapseToolbar() {
      state.toolbar.collapsed = true;
      inlineToolbar.hidden = true;
      inlineToolbarFloat.hidden = false;
      positionFloatingControls();
    }

    function expandToolbar() {
      state.toolbar.collapsed = false;
      state.toolbar.manual = false;
      inlineToolbarFloat.hidden = true;
      updateToolbar();
      positionToolbar();
    }

    function beginToolbarDrag(event) {
      event.preventDefault();
      const start = {
        x: event.clientX,
        y: event.clientY,
        left: inlineToolbar.getBoundingClientRect().left,
        top: inlineToolbar.getBoundingClientRect().top
      };
      toolbarDragHandle.setPointerCapture(event.pointerId);
      function move(moveEvent) {
        const width = inlineToolbar.offsetWidth;
        const height = inlineToolbar.offsetHeight;
        state.toolbar.manual = true;
        state.toolbar.x = clamp(start.left + moveEvent.clientX - start.x, 8, window.innerWidth - width - 8);
        state.toolbar.y = clamp(start.top + moveEvent.clientY - start.y, 8, window.innerHeight - height - 8);
        inlineToolbar.style.transform = `translate(${state.toolbar.x}px, ${state.toolbar.y}px)`;
      }
      function end() {
        toolbarDragHandle.releasePointerCapture(event.pointerId);
        toolbarDragHandle.removeEventListener("pointermove", move);
        toolbarDragHandle.removeEventListener("pointerup", end);
        toolbarDragHandle.removeEventListener("pointercancel", end);
      }
      toolbarDragHandle.addEventListener("pointermove", move);
      toolbarDragHandle.addEventListener("pointerup", end);
      toolbarDragHandle.addEventListener("pointercancel", end);
    }

    function snapshot() {
      return JSON.stringify({
        viewport: state.viewport,
        previewViewport: state.previewViewport,
        selectedLayerId: state.selectedLayerId,
        nextLayerId: state.nextLayerId,
        layers: state.layers,
        background: { ...state.background, editing: false }
      });
    }

    function restoreSnapshot(raw) {
      const data = typeof raw === "string" ? JSON.parse(raw) : raw;
      state.viewport = normalizeViewportKey(data.viewport ?? state.viewport);
      state.previewViewport = normalizeViewportKey(data.previewViewport ?? state.previewViewport);
      state.selectedLayerId = data.selectedLayerId ?? state.selectedLayerId;
      state.nextLayerId = data.nextLayerId ?? state.nextLayerId;
      state.layers = data.layers ?? state.layers;
      state.background = { ...state.background, ...(data.background ?? {}), editing: false };
      renderLayers();
    }

    let historyTimer = null;
    function scheduleHistory() {
      clearTimeout(historyTimer);
      historyTimer = setTimeout(recordHistory, 450);
    }

    function recordHistory() {
      if (state.history.restoring) return;
      clearTimeout(historyTimer);
      const raw = snapshot();
      if (state.history.stack[state.history.index] === raw) return;
      state.history.stack = state.history.stack.slice(0, state.history.index + 1);
      state.history.stack.push(raw);
      state.history.index = state.history.stack.length - 1;
      if (state.history.stack.length > 80) {
        state.history.stack.shift();
        state.history.index -= 1;
      }
      updateHistoryButtons();
    }

    function undo() {
      clearTimeout(historyTimer);
      if (state.history.index <= 0) return;
      state.history.restoring = true;
      state.history.index -= 1;
      restoreSnapshot(state.history.stack[state.history.index]);
      state.history.restoring = false;
      updateHistoryButtons();
    }

    function redo() {
      clearTimeout(historyTimer);
      if (state.history.index >= state.history.stack.length - 1) return;
      state.history.restoring = true;
      state.history.index += 1;
      restoreSnapshot(state.history.stack[state.history.index]);
      state.history.restoring = false;
      updateHistoryButtons();
    }

    function updateHistoryButtons() {
      undoBtn.disabled = state.history.index <= 0;
      redoBtn.disabled = state.history.index >= state.history.stack.length - 1;
    }

    function save() {
      clearTimeout(historyTimer);
      localStorage.setItem(storageKey, snapshot());
      showToast("헤드 섹션을 저장했습니다");
    }

    function loadSaved() {
      const raw = localStorage.getItem(storageKey);
      if (!raw) return;
      try {
        restoreSnapshot(raw);
        showToast("저장된 헤드 섹션을 불러왔습니다");
      } catch (error) {
        console.warn(error);
      }
    }

    function bindControls() {
      document.querySelectorAll("[data-viewport]").forEach((btn) => {
        btn.addEventListener("click", () => {
          state.previewViewport = normalizeViewportKey(btn.dataset.viewport);
          setViewport(btn.dataset.viewport);
        });
      });
      document.getElementById("editModeBtn").addEventListener("click", () => setMode("edit"));
      document.getElementById("previewModeBtn").addEventListener("click", () => setMode("view"));
      document.getElementById("mobilePreviewBtn").addEventListener("click", toggleMobilePreview);
      document.getElementById("saveBtn").addEventListener("click", save);
      undoBtn.addEventListener("click", undo);
      redoBtn.addEventListener("click", redo);
      backgroundFloatToggle.addEventListener("click", () => {
        const open = backgroundFloat.classList.toggle("open");
        backgroundFloatToggle.setAttribute("aria-expanded", String(open));
        state.background.editing = open && Boolean(state.background.imageDataUrl);
        applyLayouts();
      });
      document.getElementById("backgroundUploadBtn").addEventListener("click", () => document.getElementById("backgroundUpload").click());
      document.getElementById("backgroundImageDeleteBtn").addEventListener("click", deleteBackgroundImage);
      document.getElementById("backgroundFitBtn").addEventListener("click", fitBackgroundImage);
      document.getElementById("backgroundColorBtn").addEventListener("click", () => setBackgroundColor(backgroundColorInput.value));
      document.getElementById("backgroundColorDeleteBtn").addEventListener("click", deleteBackgroundColor);
      backgroundOpacityRange.addEventListener("input", () => {
        state.background.opacity = Number(backgroundOpacityRange.value);
        backgroundOpacityValue.textContent = `${backgroundOpacityRange.value}%`;
        applyBackground();
        scheduleHistory();
      });
      backgroundColorInput.addEventListener("input", () => setBackgroundColor(backgroundColorInput.value));
      document.getElementById("backgroundUpload").addEventListener("change", async (event) => {
        const file = event.target.files?.[0];
        event.target.value = "";
        if (!file) return;
        const image = await readImageFile(file);
        state.background.imageDataUrl = image.dataUrl;
        state.background.imageName = file.name;
        state.background.naturalWidth = image.width;
        state.background.naturalHeight = image.height;
        fitBackgroundImage();
      });
      backgroundEditHit.addEventListener("pointerdown", beginBackgroundEdit);
      toolbarDragHandle.addEventListener("pointerdown", beginToolbarDrag);
      document.getElementById("toolbarCollapseBtn").addEventListener("click", collapseToolbar);
      inlineToolbarFloat.addEventListener("click", expandToolbar);
      fontSizeRange.addEventListener("input", () => {
        fontSizeValue.textContent = fontSizeRange.value;
        updateSelectedStyle("fontSize", Number(fontSizeRange.value));
      });
      textColorInput.addEventListener("input", () => updateSelectedStyle("color", textColorInput.value));
      fontFamilySelect.addEventListener("change", () => updateSelectedStyle("fontFamily", fontFamilySelect.value));
      angleRange.addEventListener("input", () => {
        angleValue.textContent = `${angleRange.value}°`;
        updateSelectedLayout("r", Number(angleRange.value));
      });
      opacityRange.addEventListener("input", () => {
        opacityValue.textContent = `${opacityRange.value}%`;
        updateSelectedStyle("opacity", Number(opacityRange.value));
      });
      document.getElementById("frontBtn").addEventListener("click", bringToFront);
      document.getElementById("backBtn").addEventListener("click", sendToBack);
      document.getElementById("deleteLayerBtn").addEventListener("click", deleteSelectedLayer);
      document.getElementById("addTextBtn").addEventListener("click", () => addLayer("text"));
      document.getElementById("addImageBtn").addEventListener("click", () => addLayer("image"));
      document.getElementById("addServiceBtn").addEventListener("click", () => addLayer("service"));
      document.getElementById("addMissionBtn").addEventListener("click", () => addLayer("mission"));
      document.getElementById("uploadLayerImageBtn").addEventListener("click", () => document.getElementById("layerImageUpload").click());
      document.getElementById("layerImageUpload").addEventListener("change", async (event) => {
        const file = event.target.files?.[0];
        event.target.value = "";
        if (!file) return;
        const layer = getLayer(state.selectedLayerId);
        if (!layer) return;
        const image = await readImageFile(file);
        layer.imageDataUrl = image.dataUrl;
        if (layer.type === "text") {
          layer.type = "image";
          layer.label = "이미지 상자";
          layer.placeholder = "이미지";
        }
        renderLayers();
        recordHistory();
      });
      window.addEventListener("resize", () => {
        applyLayouts();
      });
      window.addEventListener("scroll", positionToolbar, { passive: true });
      stage.addEventListener("pointerdown", (event) => {
        if (event.target === stage || event.target === backgroundFill || event.target === backgroundImage) {
          state.background.editing = Boolean(state.background.imageDataUrl);
          applyLayouts();
        }
      });
    }

    detectAccessDevice();
    bindControls();
    renderLayers();
    loadSaved();
    setViewport(state.viewportLocked ?? state.viewport);
    setMode("edit");
    recordHistory();
  </script>
</body>
</html>
